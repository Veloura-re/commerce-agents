version: '3.8'
services:
  backend:
    build: 
      context: ../
      dockerfile: deploy/Dockerfile.backend
    ports:
      - "8000:8000"
    restart: unless-stopped
    volumes:
      - ../aitrader/outputs:/app/aitrader/outputs
      - ~/.config/gmgn/.env:/root/.config/gmgn/.env
  
  bot:
    build:
      context: ../
      dockerfile: deploy/Dockerfile.bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ../aitrader/outputs:/app/aitrader/outputs
      - ~/.config/gmgn/.env:/root/.config/gmgn/.env
